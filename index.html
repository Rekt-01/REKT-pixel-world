<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pixel World Trial</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; margin-top: 50px; }
        #grid { display: grid; grid-template-columns: repeat(10, 40px); gap: 2px; justify-content: center; margin-top: 20px; }
        .cell { width: 40px; height: 40px; background: #444; border: 1px solid #555; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #aaa;}
        .cell:hover { border-color: #fff; }
    </style>
    <!-- Load Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>Pixel World Trial</h1>
    <p>Click any tile to color it! Changes save to Supabase.</p>
    
    <div id="grid"></div>

    <script src="app.js"></script>
</body>
</html>
